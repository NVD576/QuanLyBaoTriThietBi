    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid d-flex align-items-center justify-content-between">

                <!-- Bên trái: Logo + Trang chủ -->
                <div class="d-flex align-items-center">
                    <a class="navbar-brand fw-bold me-3 d-flex align-items-center" th:href="@{/}">
                        <i class="bi bi-tools me-2"></i> Maintsys
                    </a>
                    <a class="nav-link text-light d-flex align-items-center" th:href="@{/}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-house-door-fill me-1"></i> Trang chủ
                    </a>
                </div>

                <!-- Ở giữa: FORM TÌM KIẾM -->
                <form class="d-flex align-items-center gap-2 flex-grow-1 mx-3" th:action="@{/}" method="get" sec:authorize="isAuthenticated()">
                    <input class="form-control form-control-sm" type="text" name="kw" placeholder="Tìm thiết bị..." th:value="${kw}">

                    <select class="form-select form-select-sm w-auto" name="cateId">
                        <option value="">Loại thiết bị</option>
                        <option th:each="p : ${categories}" th:value="${p.id}" th:selected="${cateId == p.id}" th:text="${p.name}"></option>
                    </select>

                    <select class="form-select form-select-sm w-auto" name="baseId">
                        <option value="">Cơ sở</option>
                        <option th:each="b : ${bases}" th:value="${b.id}" th:selected="${baseId == b.id}" th:text="${b.name}"></option>
                    </select>

                    <select class="form-select form-select-sm w-auto" name="statusId">
                        <option value="">Trạng thái</option>
                        <option th:each="s : ${status}" th:value="${s.id}" th:selected="${statusId == s.id}" th:text="${s.name}"></option>
                    </select>

                    <button class="btn btn-primary btn-sm" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>

                <!-- Bên phải: Chào mừng + Đăng xuất -->
                <ul class="navbar-nav d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <span class="navbar-text text-light fw-semibold d-flex align-items-center">
                            <i class="bi bi-person-circle me-1"></i>
                            Xin chào, <span th:text="${#authentication.name}">Tên người dùng</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm d-flex align-items-center" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </a>
                    </li>
                </ul>

            </div>
        </nav>
    </header>


    <footer th:fragment="footer">
        <div class="mt-4 p-5 bg-primary text-white rounded">
            <div>Hệ thống quản lý thiết bị &copy; 2025</div>
        </div>
    </footer>
</body>
